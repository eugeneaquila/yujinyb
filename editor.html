<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Yujin — Visual Editor</title>
<style>
:root{--bg:#0b0b0e;--panel:#121216;--panel2:#19191e;--text:#f5f5f5;--muted:#94949d;--line:#28282f;--accent:#fff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}.app{display:grid;grid-template-columns:380px 1fr;height:100vh;overflow:hidden}.side{border-right:1px solid var(--line);background:#0d0d10;overflow:auto}.top{position:sticky;top:0;z-index:4;background:rgba(13,13,16,.94);backdrop-filter:blur(15px);padding:16px;border-bottom:1px solid var(--line)}.brand{display:flex;justify-content:space-between;align-items:center}.brand b{letter-spacing:-.05em}.pill{font-size:10px;border:1px solid var(--line);border-radius:99px;padding:5px 8px;color:#999;text-transform:uppercase;letter-spacing:.1em}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}.btn{border:1px solid var(--line);background:var(--panel);color:#fff;border-radius:10px;padding:10px 12px;cursor:pointer}.btn:hover{background:#202027}.btn.primary{background:#fff;color:#08080a;border-color:#fff}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:12px}.tab{background:transparent;border:1px solid transparent;color:#888;padding:9px;border-radius:9px;cursor:pointer}.tab.active{background:#19191e;border-color:var(--line);color:#fff}.body{padding:0 14px 30px}.panel{display:none}.panel.active{display:block}.group{border:1px solid var(--line);border-radius:14px;background:var(--panel);margin:10px 0;overflow:hidden}.group-title{width:100%;background:none;color:#fff;border:0;text-align:left;padding:14px;font-weight:700;display:flex;justify-content:space-between;cursor:pointer}.group-content{border-top:1px solid var(--line);padding:4px 13px 13px}.field{margin:12px 0}.field label{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:#85858e;display:block;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;background:#09090c;color:#fff;border:1px solid var(--line);border-radius:9px;padding:10px;outline:none}.field textarea{min-height:78px;resize:vertical}.field input:focus,.field textarea:focus,.field select:focus{border-color:#777}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.color{display:grid;grid-template-columns:1fr 48px;gap:7px}.color input[type=color]{height:39px;padding:3px}.stage{min-width:0;display:grid;grid-template-rows:62px 1fr;background:#17171b}.stagebar{display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid var(--line)}.status{font-size:12px;color:#888}.stage-actions{display:flex;gap:8px}.preview{width:100%;height:calc(100vh - 62px);border:0;background:#09090b}.hint{color:#777;font-size:11px;line-height:1.5;padding:10px 2px}.modal{display:none;position:fixed;inset:0;background:#000b;z-index:20;place-items:center;padding:20px}.modal.show{display:grid}.modal-card{width:min(650px,100%);background:#121216;border:1px solid var(--line);border-radius:16px;padding:18px}.modal textarea{width:100%;height:360px;background:#08080b;color:#fff;border:1px solid var(--line);border-radius:10px;padding:12px}.modal-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:10px}
@media(max-width:900px){.app{grid-template-columns:310px 1fr}}@media(max-width:680px){.app{display:block;height:auto;overflow:visible}.side{height:auto}.stage{height:75vh}.preview{height:calc(75vh - 62px)}}
</style></head><body>
<div class="app"><aside class="side"><div class="top"><div class="brand"><b>YUJIN / VISUAL EDITOR</b><span class="pill">No Code</span></div>
<div class="actions"><button class="btn primary" id="save">Save</button><button class="btn" id="reset">Reset</button><button class="btn" id="export">Export</button><button class="btn" id="import">Import</button></div>
<div class="tabs"><button class="tab active" data-tab="content">Content</button><button class="tab" data-tab="design">Design</button><button class="tab" data-tab="sections">Sections</button></div></div>
<div class="body"><div id="content" class="panel active"></div><div id="design" class="panel"></div><div id="sections" class="panel"></div><p class="hint">This editor is built around your actual portfolio layout. The preview is the real <b>index.html</b>, not a separate mockup.</p></div></aside>
<main class="stage"><div class="stagebar"><span class="status" id="status">Live preview</span><div class="stage-actions"><button class="btn" id="open">Open public site ↗</button><button class="btn" id="refresh">Refresh</button></div></div><iframe id="frame" class="preview" src="index.html"></iframe></main></div>
<div class="modal" id="modal"><div class="modal-card"><h3>Portfolio configuration</h3><textarea id="json"></textarea><div class="modal-foot"><button class="btn" id="close">Cancel</button><button class="btn primary" id="apply">Apply</button></div></div></div>
<script>
const KEY="yujinPortfolioVisualConfig";
const D={nav:{logo:"YUJIN.",cta:"Let's talk ↗"},hero:{eyebrow:"Motion Designer · MV Animator · Compositor",title:"I make motion feel alive.",description:"I create cinematic motion, anime-inspired visuals and music-driven experiences for VTubers, artists and digital creators.",primary:"View selected work ↗",primaryLink:"#work",secondary:"Start a project",secondaryLink:"#contact",noteTitle:"Yujin — Visual Creator",noteText:"Focused on motion design, MV production, anime compositing and creator-focused visuals. Available for remote projects worldwide."},reel:{title:"Selected motion.",desc:"Replace this visual with your latest reel, then let the work do the talking.",label:"SHOWREEL 2024 — 2026",url:""},work:{title:"Things I've made.",desc:"A curated selection is stronger than a giant archive. Lead with your best work.",items:[{tag:"MV · Motion Design",title:"Music Visual",image:"",url:"#contact"},{tag:"VTuber · Promotional",title:"Debut Trailer",image:"",url:"#contact"},{tag:"Anime · Compositing",title:"Post-Shiage",image:"",url:"#contact"},{tag:"Music · Visualizer",title:"Visual Experience",image:"",url:"#contact"}]},case:{title:"Show the thinking.",desc:"The next version of your portfolio should prove not only what you made, but what you contributed.",cards:[{kicker:"01 — The brief",title:"Turn a song into a visual identity.",text:"Start with the artist's concept, references and music. Define the visual language before opening After Effects."},{kicker:"02 — The craft",title:"Animation → effects → compositing.",text:"Break down your contribution: camera movement, typography, FX, transitions, lighting, color and final polish."}]},services:{title:"What I do.",desc:"Focused services built around motion, music and character-driven visuals.",items:["Motion Design","MV Production","VTuber Visuals","Anime Compositing","Video Editing"]},process:{title:"Simple. Clear. Collaborative.",items:[{title:"Brief",text:"Goals, references, assets, music and timeline."},{title:"Direction",text:"Visual concept, mood and motion language."},{title:"Production",text:"Animation, compositing, editing and polish."},{title:"Delivery",text:"Final exports, revisions and organized files."}]},about:{title:"Meet Yujin.",text:"I'm a motion designer and visual creator obsessed with <em>movement, atmosphere and music.</em><br><br>I turn static artwork and ideas into visuals that feel cinematic, energetic and alive.",facts:[["Specialization","Anime · VTuber · Music"],["Core tools","After Effects · Premiere"],["Based in","Indonesia"],["Availability","Remote · Worldwide"]]},contact:{title:"Have a project in mind?",desc:"Tell me what you're creating, what you need, and when you need it.",email:"hello@yujinyb.com",primary:"Start a project",instagram:"Instagram ↗",instagramUrl:"https://www.instagram.com/yujinaquila/"},footer:{name:"Yujin",tag:"Motion Designer · Visual Creator"},theme:{bg:"#09090b",panel:"#111114",text:"#f5f5f5",muted:"#a1a1aa",accent:"#ffffff",accentText:"#09090b",radius:22,sectionSpace:110,maxWidth:1180,heroScale:9}};
function merge(a,b){const o=structuredClone(a);const m=(x,y)=>Object.keys(y||{}).forEach(k=>{if(y[k]&&typeof y[k]=="object"&&!Array.isArray(y[k])&&x[k]&&typeof x[k]=="object"&&!Array.isArray(x[k]))m(x[k],y[k]);else x[k]=y[k]});m(o,b);return o}
let c=merge(D,JSON.parse(localStorage.getItem(KEY)||"null"));
const $=s=>document.querySelector(s), esc=s=>String(s??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;");
function get(path){return path.split(".").reduce((o,k)=>o[k],c)}
function set(path,v){let o=c,p=path.split(".");p.slice(0,-1).forEach(k=>o=o[k]);o[p.at(-1)]=v}
function F(path,label,type="text"){let v=get(path);return `<div class="field"><label>${label}</label>${type=="textarea"?`<textarea data-p="${path}">${esc(v)}</textarea>`:type=="color"?`<div class="color"><input data-p="${path}" value="${esc(v)}"><input type="color" data-c="${path}" value="${esc(v)}"></div>`:`<input data-p="${path}" type="${type}" value="${esc(v)}">`}</div>`}
function G(title,html,open=false){return `<div class="group"><button class="group-title">${title}<span>${open?"−":"+"}</span></button><div class="group-content" style="display:${open?"block":"none"}">${html}</div></div>`}
function render(){
let x="";
x+=G("Navigation",F("nav.logo","Logo")+F("nav.cta","CTA"),true);
x+=G("Hero",F("hero.eyebrow","Eyebrow")+F("hero.title","Headline","textarea")+F("hero.description","Description","textarea")+F("hero.primary","Primary button")+F("hero.primaryLink","Primary link")+F("hero.secondary","Secondary button")+F("hero.secondaryLink","Secondary link")+F("hero.noteTitle","Side title")+F("hero.noteText","Side text","textarea"),true);
x+=G("Showreel",F("reel.title","Title")+F("reel.desc","Description","textarea")+F("reel.label","Label")+F("reel.url","Video / reel URL"));
x+=G("Selected work",F("work.title","Section title")+F("work.desc","Description","textarea")+c.work.items.map((v,i)=>G("Project "+(i+1),F(`work.items.${i}.tag`,"Tag")+F(`work.items.${i}.title`,"Title")+F(`work.items.${i}.image`,"Image URL")+F(`work.items.${i}.url`,"Project URL"),i==0)).join(""));
x+=G("Case study",F("case.title","Section title")+F("case.desc","Description","textarea")+c.case.cards.map((v,i)=>G("Case "+(i+1),F(`case.cards.${i}.kicker`,"Kicker")+F(`case.cards.${i}.title`,"Title")+F(`case.cards.${i}.text`,"Text","textarea"),i==0)).join(""));
x+=G("Services",F("services.title","Title")+F("services.desc","Description","textarea")+c.services.items.map((v,i)=>F(`services.items.${i}`,"Service "+(i+1))).join(""));
x+=G("Process",F("process.title","Title")+c.process.items.map((v,i)=>G("Step "+(i+1),F(`process.items.${i}.title`,"Title")+F(`process.items.${i}.text`,"Text","textarea"),i==0)).join(""));
x+=G("About",F("about.title","Title")+F("about.text","Body (HTML emphasis supported)","textarea")+c.about.facts.map((v,i)=>G("Fact "+(i+1),F(`about.facts.${i}.0`,"Label")+F(`about.facts.${i}.1`,"Value"),i==0)).join(""));
x+=G("Contact",F("contact.title","Title")+F("contact.desc","Description","textarea")+F("contact.email","Email")+F("contact.primary","CTA")+F("contact.instagram","Instagram button")+F("contact.instagramUrl","Instagram URL"));
x+=G("Footer",F("footer.name","Name")+F("footer.tag","Tagline"));
$("#content").innerHTML=x;
$("#design").innerHTML=G("Colors",F("theme.bg","Background","color")+F("theme.panel","Cards","color")+F("theme.text","Text","color")+F("theme.muted","Muted","color")+F("theme.accent","Accent","color")+F("theme.accentText","Accent text","color"),true)+G("Layout",F("theme.radius","Card radius","number")+F("theme.sectionSpace","Section spacing","number")+F("theme.maxWidth","Content width","number")+F("theme.heroScale","Hero scale","number"));
$("#sections").innerHTML=G("Visibility","<p class='hint'>The current portfolio has Hero, Showreel, Work, Case Study, Services, Process, About and Contact sections. This editor preserves that exact design while making its content and styling editable.</p>",true);
bind();
}
function bind(){
document.querySelectorAll("[data-p]").forEach(e=>e.addEventListener("input",()=>{set(e.dataset.p,e.type=="number"?Number(e.value):e.value);preview()}));
document.querySelectorAll("[data-c]").forEach(e=>e.addEventListener("input",()=>{set(e.dataset.c,e.value);const t=document.querySelector(`[data-p="${e.dataset.c}"]`);if(t)t.value=e.value;preview()}));
document.querySelectorAll(".group-title").forEach(b=>b.onclick=()=>{let q=b.nextElementSibling;q.style.display=q.style.display=="none"?"block":"none";b.querySelector("span").textContent=q.style.display=="none"?"+":"−"});
}
let timer;function save(){localStorage.setItem(KEY,JSON.stringify(c));status("Saved");}
function preview(){clearTimeout(timer);timer=setTimeout(()=>{localStorage.setItem(KEY,JSON.stringify(c));send()},80)}
function send(){const f=$("#frame");try{f.contentWindow.postMessage({type:"YUJIN_PREVIEW",config:c},"*")}catch(e){}status("Live preview")}
function status(t){$("#status").textContent=t}
$("#frame").addEventListener("load",()=>send());
$("#save").onclick=save;$("#refresh").onclick=()=>{const f=$("#frame");f.src="index.html?preview="+Date.now();status("Refreshing…")};
$("#open").onclick=()=>window.open("index.html","_blank");
$("#reset").onclick=()=>{if(confirm("Reset the portfolio to the original design/content?")){c=structuredClone(D);save();render();send()}};
$("#export").onclick=()=>{const b=new Blob([JSON.stringify(c,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="yujin-portfolio-config.json";a.click()};
$("#import").onclick=()=>{$("#modal").classList.add("show");$("#json").value=JSON.stringify(c,null,2)};
$("#close").onclick=()=>$("#modal").classList.remove("show");
$("#apply").onclick=()=>{try{c=merge(D,JSON.parse($("#json").value));save();render();send();$("#modal").classList.remove("show")}catch(e){alert("Invalid JSON")}};
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));document.querySelectorAll(".panel").forEach(x=>x.classList.remove("active"));t.classList.add("active");$("#"+t.dataset.tab).classList.add("active")});
render();
</script></body></html>
